[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.26"
evm_version = "cancun"

via_ir = false
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"

ffi = false

# Local Forge execution gas budget; used by tests and local script simulation.
# Does not change Solidity compilation, generated bytecode, the EVM target, deployed-chain gas limits,
# deployed Standby contract execution limits, or Standby protocol semantics.
#
# The canonical StandbyHook deployment mines its address with the pinned `HookMiner.find`, which rehashes
# the whole creation code and allocates a fresh buffer on every one of its `MAX_LOOP` = 160,444 candidate
# salts. The resulting cost is quadratic in the iteration count, so Foundry's default 2^30 call gas limit
# stops the pinned search after roughly 125,000 of its own iterations — and a Hook whose valid salt lies
# beyond that point fails to deploy for want of gas rather than for want of a salt. Standby's own bounded
# execution is enforced by explicit protocol bounds and reverts, never by exhausting a gas limit, so
# raising this weakens no requirement and hides no unbounded production path.
gas_limit = 10000000000

[profile.default.fuzz]
runs = 1000
seed = "0x1"

[profile.default.invariant]
runs = 500
depth = 100
seed = "0x1"

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]

solc = "0.8.26"
evm_version = "cancun"

via_ir = false
optimizer = true
optimizer_runs = 800
bytecode_hash = "none"

ffi = false

# Local Forge execution gas budget; used by tests and local script simulation. See the note on the default
# profile: the pinned HookMiner search needs more than the default 2^30.
gas_limit = 10000000000

[profile.ci.fuzz]
runs = 10000
seed = "0x1"

[profile.ci.invariant]
runs = 1000
depth = 500
seed = "0x1"

[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "screaming-snake-case-immutable",
    "asm-keccak256",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
